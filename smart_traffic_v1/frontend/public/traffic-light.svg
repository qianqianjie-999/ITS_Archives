<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <!-- 发光效果 -->
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="2" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <!-- 阴影效果 -->
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="2" dy="3" stdDeviation="2" flood-opacity="0.4"/>
    </filter>
    <!-- 渐变背景 -->
    <linearGradient id="bodyGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#2a2a2a"/>
      <stop offset="50%" style="stop-color:#1a1a1a"/>
      <stop offset="100%" style="stop-color:#0a0a0a"/>
    </linearGradient>
    <!-- 红色发光 -->
    <radialGradient id="redLight" cx="50%" cy="50%" r="50%">
      <stop offset="0%" style="stop-color:#ff4444"/>
      <stop offset="70%" style="stop-color:#cc0000"/>
      <stop offset="100%" style="stop-color:#880000"/>
    </radialGradient>
    <!-- 黄色发光 -->
    <radialGradient id="yellowLight" cx="50%" cy="50%" r="50%">
      <stop offset="0%" style="stop-color:#ffdd00"/>
      <stop offset="70%" style="stop-color:#ffaa00"/>
      <stop offset="100%" style="stop-color:#cc8800"/>
    </radialGradient>
    <!-- 绿色发光 -->
    <radialGradient id="greenLight" cx="50%" cy="50%" r="50%">
      <stop offset="0%" style="stop-color:#44ff44"/>
      <stop offset="70%" style="stop-color:#00cc00"/>
      <stop offset="100%" style="stop-color:#008800"/>
    </radialGradient>
  </defs>
  
  <!-- 底座 -->
  <rect x="20" y="56" width="24" height="6" rx="2" fill="#333"/>
  
  <!-- 支架 -->
  <rect x="29" y="40" width="6" height="18" fill="#222"/>
  
  <!-- 信号灯主体 -->
  <rect x="12" y="6" width="40" height="36" rx="8" fill="url(#bodyGradient)" filter="url(#shadow)"/>
  
  <!-- 信号灯边框 -->
  <rect x="12" y="6" width="40" height="36" rx="8" fill="none" stroke="#444" stroke-width="2"/>
  
  <!-- 玻璃罩效果 -->
  <rect x="16" y="10" width="32" height="28" rx="5" fill="rgba(255,255,255,0.05)"/>
  
  <!-- 红灯 -->
  <circle cx="32" cy="15" r="5" fill="url(#redLight)" filter="url(#glow)"/>
  <circle cx="32" cy="15" r="3" fill="rgba(255,100,100,0.6)"/>
  
  <!-- 黄灯 -->
  <circle cx="32" cy="26" r="5" fill="#3a3a3a"/>
  <circle cx="32" cy="26" r="3" fill="rgba(100,100,100,0.3)"/>
  
  <!-- 绿灯 -->
  <circle cx="32" cy="37" r="5" fill="#3a3a3a"/>
  <circle cx="32" cy="37" r="3" fill="rgba(100,100,100,0.3)"/>
  
  <!-- 高光效果 -->
  <ellipse cx="28" cy="13" rx="1.5" ry="1" fill="rgba(255,255,255,0.4)"/>
  <ellipse cx="28" cy="24" rx="1.5" ry="1" fill="rgba(255,255,255,0.2)"/>
  <ellipse cx="28" cy="35" rx="1.5" ry="1" fill="rgba(255,255,255,0.2)"/>
</svg>
